# SNMP del laboratorio: responde con la comunidad 'public' y expone, a propósito,
# un hash y un JWT en campos de texto. Así `tarascan <ip>` los saca por SNMP y el
# copiloto (--guided/--auto) puede encadenar a `tarascan hash/jwt <valor>`.
# Valores de MENTIRA, solo para el lab.

rocommunity public default
sysServices 72
sysName tarascan-lab-snmp

# El hash (MD5 de 'password') aparece en el campo de contacto:
syscontact admin_md5:5f4dcc3b5aa765d61d8327deb882cf99

# Un JWT (alg=none, forjable) aparece en la ubicación:
syslocation token:eyJhbGciOiJub25lIn0.eyJ1c2VyIjoiYWRtaW4iLCJyb2xlIjoiZ3Vlc3QifQ.
