# Laboratorio de pruebas para TaraScan.
#
# Objetivos deliberadamente débiles y LOCALES para practicar recon de forma
# legal (contra algo tuyo) antes de tocar cualquier sistema real. Cada servicio
# está pensado para que una parte de tarascan tenga algo que encontrar.
# No expongas estos contenedores a Internet: están hechos para ser inseguros.
#
# Dos formas de usarlo:
#
#   1) Recon de un objetivo concreto. Todos los servicios publican sus puertos
#      en el host, así que escaneas localhost:
#         docker compose up -d
#         tarascan 127.0.0.1
#
#   2) Mapa de red (tarascan --net). Los contenedores viven en una subred Docker
#      propia (172.30.0.0/24) con IP y MAC fijas, imitando una red con equipos
#      variados (Windows, Linux, router, NAS, Raspberry...). Escaneas la subred:
#         docker compose up -d
#         tarascan --net 172.30.0.0/24
#
# Parar y borrar datos:   docker compose down -v
#
# Cobertura por servicio (recon de objetivo):
#   web (WordPress, 80)  -> nmap, whatweb, wafw00f, http-headers, gobuster,
#                           ffuf, nikto, nuclei, wpscan, searchsploit
#   https (443)          -> sslscan (certificado autofirmado)
#   smb (139/445)        -> smbclient, enum4linux, netexec (sesión nula)
#   ssh (22)             -> searchsploit (versión OpenSSH), hydra (--brute ssh)
#   snmp (161/udp)       -> onesixtyone, snmp (comunidad 'public')
#
# Qué aporta cada host al mapa de red (tarascan --net):
#   .10 web      80       -> web, SO deducido por cabecera Server, fabricante HP
#   .11 https    443      -> HTTPS suelto
#   .20 smb      139/445  -> nombre y SO por netexec (SMB), tipo Windows
#   .30 ssh      22       -> SO Linux por banner SSH
#   .40 snmp     (161/udp)-> host vivo con MAC de fabricante (HP)
#   .50 router   23/53    -> fabricante Cisco -> "Router / Switch"
#   .60 nas      139/443  -> fabricante Synology -> "NAS"
#   .70 pi       22       -> banner SSH Raspbian + fabricante Raspberry Pi
#   .80 mac      443      -> fabricante Apple -> "Apple macOS / iOS"


services:
  # --- Web principal: WordPress (dispara whatweb -> wpscan) ---
  wp-db:
    image: mariadb:11
    container_name: tarascan-lab-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped

  web:
    image: wordpress:latest
    container_name: tarascan-lab-web
    hostname: web-lab
    depends_on:
      - wp-db
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # WP_HOME/WP_SITEURL dinámicos según el host con el que se accede: así el
      # sitio responde igual por 127.0.0.1 o por la IP del Docker, sin redirigir
      # a "localhost" (que era lo que despistaba a whatweb/wpscan). El $$ escapa
      # el $ para que docker-compose no lo interprete como variable suya.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://' . $$_SERVER['HTTP_HOST']);
        define('WP_SITEURL', 'http://' . $$_SERVER['HTTP_HOST']);
    volumes:
      - wp-data:/var/www/html
    ports:
      - "80:80"
    networks:
      backend: {}
      labnet:
        ipv4_address: 172.30.0.10
        mac_address: "00:01:e6:aa:bb:04"   # Hewlett Packard (OUI)
    restart: unless-stopped

  # Instala WordPress de forma desatendida (best-effort) para que el sitio esté
  # completo, no solo el asistente de instalación. Se ejecuta una vez y sale.
  wp-setup:
    image: wordpress:cli
    depends_on:
      - web
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-data:/var/www/html
    networks:
      - backend
    entrypoint: /bin/sh
    command: >
      -c "sleep 25;
      wp core install --url=http://localhost --title='Laboratorio de pruebas'
      --admin_user=admin --admin_password=admin123 --admin_email=admin@example.com --skip-email;
      exit 0"
    restart: "no"

  # --- HTTPS con certificado autofirmado de laboratorio (para sslscan) ---
  https:
    image: nginx:alpine
    container_name: tarascan-lab-https
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "443:443"
    networks:
      labnet:
        ipv4_address: 172.30.0.11
        mac_address: "00:14:22:aa:bb:11"   # Dell (OUI)
    restart: unless-stopped

  # --- SMB: share público sin autenticación + usuario de prueba ---
  # Ejercita smbclient, enum4linux y netexec (sesión nula).
  # En el mapa de red, netexec saca su nombre y SO (tipo Windows).
  # (nbtscan no aplica: esta imagen no levanta nmbd / servicio de nombres NetBIOS.)
  smb:
    image: dperson/samba
    container_name: tarascan-lab-smb
    hostname: WIN-DESKTOP-01
    command:
      - "-u"
      - "testuser;testpass"
      - "-s"
      - "public;/share;yes;no;yes;all"
      - "-g"
      - "map to guest = Bad User"
      - "-p"
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - ./smb-share:/share
    networks:
      labnet:
        ipv4_address: 172.30.0.20
        mac_address: "00:50:56:aa:bb:20"
    restart: unless-stopped

  # --- SSH con credencial débil (para searchsploit e hydra --brute ssh) ---
  # Usuario admin / contraseña 'password' (ambos en las wordlists por defecto).
  # En el mapa de red, su banner SSH identifica el SO como Linux.
  ssh:
    image: lscr.io/linuxserver/openssh-server
    container_name: tarascan-lab-ssh
    hostname: PC-OFICINA-01
    environment:
      - PASSWORD_ACCESS=true
      - USER_NAME=admin
      - USER_PASSWORD=password
      - LISTEN_PORT=22   # en el 22 de verdad, para que el mapa de red vea el banner
    ports:
      - "22:22"
    networks:
      labnet:
        ipv4_address: 172.30.0.30
        mac_address: "00:1a:a0:aa:bb:30"   # Dell (OUI)
    restart: unless-stopped

  # --- SNMP con comunidad 'public' (para onesixtyone y snmp) ---
  snmp:
    image: polinux/snmpd
    container_name: tarascan-lab-snmp
    ports:
      - "161:161/udp"
    networks:
      labnet:
        ipv4_address: 172.30.0.40
        mac_address: "00:01:e6:aa:bb:40"   # Hewlett Packard (OUI)
    restart: unless-stopped

  # --- Dispositivos "de pega" solo para el mapa de red ---
  # No sirven nada real: abren un par de puertos y su MAC decide el fabricante,
  # que tarascan traduce a tipo de equipo. Demuestran la deducción de SO por OUI.

  # Router: puertos de router (telnet/DNS) + MAC Cisco -> "Router / Switch".
  router:
    build: ./simdevice
    image: tarascan-simdevice
    container_name: tarascan-lab-router
    hostname: gw-router
    command: ["23", "53"]
    networks:
      labnet:
        ipv4_address: 172.30.0.50
        mac_address: "00:00:0c:aa:bb:50"   # Cisco Systems (OUI)
    restart: unless-stopped

  # NAS: comparticiones + MAC Synology -> "NAS".
  nas:
    image: tarascan-simdevice
    container_name: tarascan-lab-nas
    hostname: NAS-CASA
    command: ["139", "443"]
    depends_on:
      - router
    networks:
      labnet:
        ipv4_address: 172.30.0.60
        mac_address: "00:11:32:aa:bb:60"   # Synology (OUI)
    restart: unless-stopped

  # Raspberry Pi: banner SSH Raspbian + MAC Raspberry -> "Linux (Raspberry Pi)".
  pi:
    image: tarascan-simdevice
    container_name: tarascan-lab-pi
    hostname: raspberrypi
    command: ["22=SSH-2.0-OpenSSH_9.2p1 Raspbian-2+deb12u3"]
    depends_on:
      - router
    networks:
      labnet:
        ipv4_address: 172.30.0.70
        mac_address: "28:cd:c1:aa:bb:70"   # Raspberry Pi (OUI)
    restart: unless-stopped

  # Equipo Apple: MAC Apple -> "Apple macOS / iOS".
  mac:
    image: tarascan-simdevice
    container_name: tarascan-lab-mac
    hostname: MacBook-de-casa
    command: ["443"]
    depends_on:
      - router
    networks:
      labnet:
        ipv4_address: 172.30.0.80
        mac_address: "00:03:93:aa:bb:80"   # Apple (OUI)
    restart: unless-stopped

networks:
  # Subred escaneable por el mapa de red (tarascan --net 172.30.0.0/24).
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  # Red interna solo para que WordPress hable con su base de datos; no se escanea.
  backend:
    driver: bridge
    internal: true

volumes:
  db-data:
  wp-data:
