# API de pega para probar `tarascan web`: expone documentación OpenAPI y un
# endpoint GraphQL con la introspección ABIERTA. Las rutas inexistentes dan 404
# (no catch-all), para que la detección de API sea limpia.
server {
    listen 80 default_server;
    server_name _;

    location = /swagger.json {
        default_type application/json;
        alias /usr/share/nginx/html/swagger.json;
    }
    location = /openapi.json {
        default_type application/json;
        alias /usr/share/nginx/html/swagger.json;
    }
    location = /v2/api-docs {
        default_type application/json;
        alias /usr/share/nginx/html/swagger.json;
    }

    # GraphQL con introspección abierta: responde el esquema a cualquier método.
    location = /graphql {
        default_type application/json;
        return 200 '{"data":{"__schema":{"queryType":{"name":"Query"},"types":[{"name":"Query"},{"name":"User"},{"name":"Password"},{"name":"Secret"},{"name":"Mutation"}]}}}';
    }

    location = / {
        default_type text/plain;
        return 200 'API gateway (lab)\n';
    }

    # Todo lo demás: 404 de verdad (nada de catch-all).
    location / {
        return 404;
    }
}
